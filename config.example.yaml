# Copia in config.yaml (ignorato da git) e completa.
# Le voci marcate DA DEFINIRE si ricavano dalla discovery (docs/everli-api.md).

everli:
  store:
    id: ""                # DA DEFINIRE: ID o slug del supermercato
    name: ""              # solo per i messaggi, es. "Esselunga Via Roma"
  session_file: .state/everli-session.json
  meta_file: .state/everli-meta.json     # user agent salvato da discover.py

  endpoint:
    url: ""               # DA DEFINIRE, es. https://api.everli.com/.../stores/{store_id}/promotions
    method: GET           # GET oppure POST (con body JSON in `body`)
    params: {}            # parametri fissi; {store_id} viene sostituito
    body: {}              # solo per POST
    headers: {}           # solo header NON sensibili (accept-language, x-app-version…)
    auth:
      type: cookie        # cookie (dalla sessione) | local_storage_bearer
      key: ""             # per local_storage_bearer: nome della chiave in localStorage
    items_path: ""        # DA DEFINIRE: percorso della lista prodotti, es. data.products
    pagination:
      type: page          # page | offset | none
      param: page         # nome del parametro pagina/offset
      start: 1
      size_param: ""      # es. per_page (vuoto = non inviato)
      size: 0             # elementi per pagina (0 = sconosciuto)
      last_page_path: ""  # opzionale, es. meta.last_page
      max_pages: 10
    fields:               # DA DEFINIRE: percorsi a punti dentro ogni elemento (es. price.original)
      id: id
      name: name
      brand: ""
      format: ""
      price_full: ""
      price_discounted: ""
      discount_pct: ""    # vuoto = calcolato dai due prezzi
      valid_until: ""
      url: ""
    price_divisor: 1      # 100 se i prezzi sono in centesimi
    product_url_template: ""   # se `url` manca, es. https://it.everli.com/s/.../p/{id}

  limits:
    max_requests: 30      # tetto per esecuzione
    min_delay: 2.0        # pausa casuale tra richieste (secondi)
    max_delay: 6.0
    timeout: 20

reminders:
  list: Spesa
  backend: auto           # auto | app | eventkit | jxa (auto = il primo disponibile in quest'ordine)
  app: bin/EvershopperReminders.app
  helper: bin/reminders-helper

schedule:                 # fase 6
  weekday: 6              # 0 = domenica … 6 = sabato
  hour: 9
  minute: 0

output:
  channel: notification   # notification | note | email
  min_discount_pct: 10

paths:
  cache_dir: cache
  log_dir: logs
